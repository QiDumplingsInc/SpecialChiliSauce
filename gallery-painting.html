<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Painting - Kay's Gallery</title>
  <meta name="description" content="Paintings by Kay.">

  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    .category-hero {
      padding: var(--spacing-xl) 0 var(--spacing-lg);
      text-align: center;
    }

    .category-hero h1 {
      font-size: var(--font-size-4xl);
      color: var(--color-text);
      margin-bottom: var(--spacing-sm);
    }

    .category-back {
      display: inline-block;
      margin-bottom: var(--spacing-md);
      font-family: var(--font-family-ui);
      font-size: var(--font-size-sm);
      color: var(--color-text-light);
      text-decoration: none;
    }

    .category-back:hover {
      color: var(--color-text);
    }

    .painting-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--spacing-md);
      padding-bottom: var(--spacing-xl);
    }

    .painting-placeholder {
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-lighter);
      border: 2px dashed var(--color-text-lighter);
      border-radius: var(--radius-md);
      color: var(--color-text-lighter);
      font-family: var(--font-family-ui);
      font-size: var(--font-size-sm);
      text-align: center;
      padding: var(--spacing-md);
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header role="banner">
    <div class="language-switcher" role="navigation" aria-label="Language switcher">
      <button class="lang-btn active" data-lang="en" aria-label="Switch to English">EN</button>
      <button class="lang-btn" data-lang="zh" aria-label="切换到中文">中文</button>
    </div>
    <div class="container">
      <div class="header-content">
        <div class="logo lang-en">Kay's Gallery</div>
        <div class="logo lang-zh">Kay's 画廊</div>
        <nav class="header-nav" role="navigation" aria-label="Site navigation">
          <a href="home.html">
            <span class="lang-en"><span aria-hidden="true">🏠</span> Home</span><span class="lang-zh"><span aria-hidden="true">🏠</span> 首页</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Category hero -->
  <section class="category-hero">
    <div class="container">
      <a href="gallery.html" class="category-back lang-en">&larr; Back to Gallery</a>
      <a href="gallery.html" class="category-back lang-zh">&larr; 返回画廊</a>
      <h1 class="lang-en">Painting</h1>
      <h1 class="lang-zh">绘画</h1>
    </div>
  </section>

  <!--
    PLACEHOLDER: replace the tiles below with real images once
    available, e.g.:
    <div class="painting-item">
      <img src="assets/gallery/painting-1.jpg" alt="Description of the painting" loading="lazy">
    </div>
  -->
  <section class="container">
    <div class="painting-grid">
      <div class="painting-placeholder">
        <span class="lang-en">Painting coming soon</span>
        <span class="lang-zh">画作即将上线</span>
      </div>
      <div class="painting-placeholder">
        <span class="lang-en">Painting coming soon</span>
        <span class="lang-zh">画作即将上线</span>
      </div>
      <div class="painting-placeholder">
        <span class="lang-en">Painting coming soon</span>
        <span class="lang-zh">画作即将上线</span>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer role="contentinfo">
    <div class="container">
      <div class="footer-content">
        <p class="lang-en">&copy; 2024&ndash;<span id="copyright-year"></span> Kay's Creations. All rights reserved.</p>
        <p class="lang-zh">&copy; 2024&ndash;<span id="copyright-year-zh"></span> Kay's创作空间。版权所有。</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/language.js"></script>
  <script>
    const currentYear = new Date().getFullYear();
    document.querySelectorAll('#copyright-year, #copyright-year-zh').forEach(el => {
      el.textContent = currentYear;
    });
  </script>
</body>

</html>
