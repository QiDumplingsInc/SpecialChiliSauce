<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Kay's Creations - Home</title>
  <meta name="description" content="Welcome to Kay's Creations: handcrafted chili sauce and Kay's original paintings.">

  <link rel="icon" type="image/png" href="assets/logo/favicon.png">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    .hub-hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--spacing-xl) 0;
    }

    .hub-hero h1 {
      font-size: var(--font-size-5xl);
      color: var(--color-text);
      margin-bottom: var(--spacing-sm);
    }

    .hub-tagline {
      font-size: var(--font-size-xl);
      color: var(--color-text-light);
      margin-bottom: var(--spacing-xl);
      font-style: italic;
    }

    .hub-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-lg);
      max-width: 700px;
      margin: 0 auto;
    }

    .hub-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-sm);
      background: var(--color-white);
      border: 1px solid var(--color-bg-lighter);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg) var(--spacing-md);
      text-decoration: none;
      color: var(--color-text);
      transition: var(--transition-base);
    }

    .hub-card:hover {
      border-color: var(--color-text);
      transform: translateY(-4px);
    }

    .hub-card-icon {
      font-size: 3.5rem;
    }

    .hub-card-title {
      font-size: var(--font-size-xl);
      font-weight: bold;
      font-family: var(--font-family-ui);
      color: var(--color-text);
    }

    .hub-card-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-text-light);
      font-family: var(--font-family-ui);
    }

    @media (max-width: 600px) {
      .hub-options {
        grid-template-columns: 1fr;
      }

      .hub-hero h1 {
        font-size: var(--font-size-3xl);
      }
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header role="banner">
    <!-- Language Switcher: nested inside header so mobile positioning
         is relative to the header box, never above/overlapping it -->
    <div class="language-switcher" role="navigation" aria-label="Language switcher">
      <button class="lang-btn active" data-lang="en" aria-label="Switch to English">EN</button>
      <button class="lang-btn" data-lang="zh" aria-label="切换到中文">中文</button>
    </div>
    <div class="container">
      <div class="header-content">
        <div class="logo lang-en">Kay's Creations</div>
        <div class="logo lang-zh">Kay's 创作空间</div>
      </div>
    </div>
  </header>

  <!-- Hub Hero -->
  <section class="hub-hero">
    <div class="container">
      <h1 class="lang-en">Welcome</h1>
      <h1 class="lang-zh">欢迎</h1>
      <p class="hub-tagline lang-en">Handcrafted chili sauce, and Kay's original paintings</p>
      <p class="hub-tagline lang-zh">手工特制辣椒酱，以及Kay的原创画作</p>

      <div class="hub-options">
        <a href="index.html" class="hub-card">
          <span class="hub-card-icon" aria-hidden="true">🌶️</span>
          <span class="hub-card-title lang-en">Special Chili Sauce</span>
          <span class="hub-card-title lang-zh">特制辣椒酱</span>
          <span class="hub-card-subtitle lang-en">Shop &amp; learn more</span>
          <span class="hub-card-subtitle lang-zh">选购 &amp; 了解更多</span>
        </a>
        <a href="gallery.html" class="hub-card">
          <span class="hub-card-icon" aria-hidden="true">🎨</span>
          <span class="hub-card-title lang-en">Gallery</span>
          <span class="hub-card-title lang-zh">画廊</span>
          <span class="hub-card-subtitle lang-en">Paintings by Kay</span>
          <span class="hub-card-subtitle lang-zh">Kay的画作</span>
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer role="contentinfo">
    <div class="container">
      <div class="footer-content">
        <p class="lang-en">&copy; 2024&ndash;<span id="copyright-year"></span> Kay's Creations. All rights reserved.</p>
        <p class="lang-zh">&copy; 2024&ndash;<span id="copyright-year-zh"></span> Kay's创作空间。版权所有。</p>
      </div>
    </div>
  </footer>

  <script src="assets/js/language.js"></script>
  <script>
    const currentYear = new Date().getFullYear();
    document.querySelectorAll('#copyright-year, #copyright-year-zh').forEach(el => {
      el.textContent = currentYear;
    });
  </script>
</body>

</html>
